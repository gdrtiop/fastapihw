version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tasknet
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    networks:
      - tasknet
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  fastapi_app:
    image: fastapi_app:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - tasknet
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s

networks:
  tasknet:
    driver: overlay

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local